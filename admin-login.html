<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | RS Cleaning Collective</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-shell admin-login-page">
  <div class="admin-login-wrapper">
    <form class="admin-login-card" data-admin-login>
      <div class="admin-login-brand">
        <span class="admin-login-mark">RS</span>
        <div>
          <strong>RS Cleaning Collective</strong>
          <span>Admin workspace</span>
        </div>
      </div>
      <h1>Sign in</h1>
      <p class="admin-login-lead">Manage leads, quotes, and bookings.</p>
      <label class="admin-login-field">
        <span>Email</span>
        <input type="email" name="email" required placeholder="admin@example.com" autocomplete="username">
      </label>
      <label class="admin-login-field">
        <span>Password</span>
        <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </label>
      <button class="button admin-login-submit" type="submit">
        <i data-lucide="lock"></i> Sign in
      </button>
      <div data-form-state class="form-state admin-login-state" role="status"></div>
    </form>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/admin.js"></script>
  <script>if(typeof lucide !== 'undefined') lucide.createIcons();</script>
</body>
</html>
